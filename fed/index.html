<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubVault - 极简订阅管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Noto Sans SC (思源黑体) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // 针对中文优化的字体栈
              sans: [
                '"Noto Sans SC"', 
                '"PingFang SC"', 
                '"Hiragino Sans GB"', 
                '"Microsoft YaHei"', 
                '"Inter"', 
                'system-ui', 
                '-apple-system', 
                'sans-serif'
              ],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              brand: {
                50: '#f8faff',
                100: '#f0f4ff',
                200: '#e0e8ff',
                500: '#5850ec',
                600: '#4338ca',
                700: '#3730a3',
              }
            },
            boxShadow: {
              'card': '0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02)',
              'card-hover': '0 12px 20px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
            },
            animation: {
              'subtle-pulse': 'subtlePulse 2.5s ease-in-out infinite',
            },
            keyframes: {
              subtlePulse: {
                '0%, 100%': { opacity: 1 },
                '50%': { opacity: 0.65 },
              }
            }
          },
        },
      }
    </script>
    <style>
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body {
        background-color: #f9fafb;
        color: #272e3b;
        /* 中文不需要过紧的字间距 */
        letter-spacing: 0.01em;
        overflow-x: hidden;
      }
      #root { min-width: 0; }
      /* 价格数字等宽显示 */
      .tabular {
        font-variant-numeric: tabular-nums;
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
      
      .compact-card {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .compact-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      }
      .glass-blur {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      
      /* Accessibility: Respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .compact-card:hover {
          transform: none;
        }
      }
      
      /* Focus visible states for keyboard navigation */
      :focus-visible {
        outline: 2px solid #5850ec;
        outline-offset: 2px;
      }

      @media (max-width: 767px) {
        body { letter-spacing: 0; }
        .mobile-app-shell { height: 100dvh; }
        .mobile-header { display: flex; }
        .mobile-sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          width: min(18rem, 86vw);
          transform: translateX(-100%);
          transition: transform 0.2s ease-out;
          padding-bottom: env(safe-area-inset-bottom);
          overflow-y: auto;
        }
        .mobile-sidebar.is-open { transform: translateX(0); }
        .mobile-content-shell { width: 100%; }

        main[class*="px-8"],
        div[class*="overflow-y-auto"][class*="px-8"] { padding: 1rem; }

        main > div > div > div[class*="justify-between"],
        div[class*="overflow-y-auto"] > div > div[class*="justify-between"][class*="items-end"] {
          align-items: stretch;
          flex-direction: column;
          gap: 1rem;
        }
        main > div > div > div[class*="justify-between"] > div:last-child,
        div[class*="overflow-y-auto"] > div > div[class*="justify-between"][class*="items-end"] > div:last-child {
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
        main > div > div > div[class*="justify-between"] > div:last-child > button,
        div[class*="overflow-y-auto"] > div > div[class*="justify-between"][class*="items-end"] > div:last-child > button {
          flex: 1 1 auto;
          justify-content: center;
          min-height: 2.75rem;
        }

        .fixed.inset-0[class*="items-center"] { padding: 0.75rem; }
        .fixed.inset-0[class*="items-center"] > div[class*="bg-white"] {
          max-height: calc(100dvh - 1.5rem);
          border-radius: 1rem;
          display: flex;
          flex-direction: column;
        }
        .fixed.inset-0[class*="items-center"] > div[class*="bg-white"] > div[class*="overflow-y-auto"],
        .fixed.inset-0[class*="items-center"] > div[class*="bg-white"] > div[class*="space-y"] {
          min-height: 0;
          overflow-y: auto;
        }
        .fixed.inset-0 [class*="p-7"] { padding: 1.25rem; }
        .fixed.inset-0 [class*="p-6"] { padding: 1rem; }
        .fixed.inset-0 [class*="grid-cols-2"] { grid-template-columns: minmax(0, 1fr); }

        .credential-table { -webkit-overflow-scrolling: touch; }
        .credential-table [class*="opacity-0"] { opacity: 1; }
        .memo-markdown-preview { overflow-wrap: anywhere; }
        .memo-markdown-preview table { display: block; overflow-x: auto; }
        .memo-markdown-preview pre { max-width: 100%; }

        button, input, select, textarea { max-width: 100%; }
        input, select, textarea { font-size: 16px; }
        h2 { overflow-wrap: anywhere; }
      }

      /* Markdown preview styles */
      .memo-markdown-preview h1 { font-size: 1.5em; font-weight: 700; margin: 0.8em 0 0.4em; color: #1e293b; }
      .memo-markdown-preview h2 { font-size: 1.3em; font-weight: 700; margin: 0.7em 0 0.35em; color: #1e293b; }
      .memo-markdown-preview h3 { font-size: 1.15em; font-weight: 600; margin: 0.6em 0 0.3em; color: #334155; }
      .memo-markdown-preview h4,
      .memo-markdown-preview h5,
      .memo-markdown-preview h6 { font-size: 1em; font-weight: 600; margin: 0.5em 0 0.25em; color: #334155; }
      .memo-markdown-preview p { margin: 0.5em 0; line-height: 1.7; }
      .memo-markdown-preview ul { list-style: disc; padding-left: 1.5em; margin: 0.5em 0; }
      .memo-markdown-preview ol { list-style: decimal; padding-left: 1.5em; margin: 0.5em 0; }
      .memo-markdown-preview li { margin: 0.2em 0; line-height: 1.6; }
      .memo-markdown-preview li > ul,
      .memo-markdown-preview li > ol { margin: 0.1em 0; }
      .memo-markdown-preview a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; }
      .memo-markdown-preview a:hover { color: #1d4ed8; }
      .memo-markdown-preview code { background: #f1f5f9; padding: 0.15em 0.4em; border-radius: 0.25em; font-size: 0.875em; font-family: ui-monospace, monospace; color: #475569; }
      .memo-markdown-preview pre { background: #f1f5f9; padding: 0.8em 1em; border-radius: 0.5em; overflow-x: auto; margin: 0.6em 0; }
      .memo-markdown-preview pre code { background: none; padding: 0; font-size: 0.85em; }
      .memo-markdown-preview blockquote { border-left: 3px solid #cbd5e1; padding-left: 1em; margin: 0.6em 0; color: #64748b; font-style: italic; }
      .memo-markdown-preview hr { border: none; border-top: 1px solid #e2e8f0; margin: 1em 0; }
      .memo-markdown-preview table { border-collapse: collapse; width: 100%; margin: 0.6em 0; }
      .memo-markdown-preview th,
      .memo-markdown-preview td { border: 1px solid #e2e8f0; padding: 0.4em 0.8em; text-align: left; font-size: 0.875em; }
      .memo-markdown-preview th { background: #f8fafc; font-weight: 600; }
      .memo-markdown-preview img { max-width: 100%; border-radius: 0.5em; }
      .memo-markdown-preview strong { font-weight: 600; }

      /* Compact variant for MemoCard - reset margins for tight display */
      .memo-markdown-preview--compact p { margin: 0.15em 0; }
      .memo-markdown-preview--compact h1,
      .memo-markdown-preview--compact h2,
      .memo-markdown-preview--compact h3 { font-size: 1em; margin: 0.15em 0; }
      .memo-markdown-preview--compact ul,
      .memo-markdown-preview--compact ol { margin: 0.1em 0; }
      .memo-markdown-preview--compact pre { margin: 0.2em 0; padding: 0.4em 0.6em; }
      
      /* Smooth animations with ease-out */
      .animate-slide-up {
        animation: slideUp 0.3s ease-out forwards;
      }
      .animate-fade-in {
        animation: fadeIn 0.25s ease-out forwards;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
